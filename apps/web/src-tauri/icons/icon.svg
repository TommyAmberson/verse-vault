<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <!--
    Verse Vault app icon: two V's. On the left, an open book seen from
    below, its spine the point of the V; on the right, on top of it, a
    brass padlock whose body is the second V.

    This is the source for every icon in this directory. To regenerate
    them, render it to a 1024px PNG and run `pnpm tauri icon <png>` from
    apps/web. iOS doesn't allow transparency, so render the ios/ set from
    a copy with the background rect's rx removed. The browser tab icon,
    apps/web/public/favicon.svg, repeats the padlock alone; keep the two
    in step.
  -->
  <defs>
    <!-- Shapes are drawn around their own centre at (0,0). -->

    <!-- Left half of the book: cover, page block, and three page edges. -->
    <g id="book-half">
      <path d="M-4 150 L-162 -126" stroke="#7a2e2a" stroke-width="18" stroke-linecap="round"/>
      <path d="M0 138 C-50 52 -100 -34 -150 -120 L-119 -136.1 L-88 -144 L-57 -140.1 L-26 -128 C-10 -60 -2 40 0 138Z" fill="#f1e4c2"/>
      <g stroke="#c4a96f" stroke-width="5" fill="none">
        <path d="M0 138 C-38 49 -77.5 -47.6 -119 -136.1"/>
        <path d="M0 138 C-26 46 -55 -57 -88 -144"/>
        <path d="M0 138 C-14 43 -32.5 -60.6 -57 -140.1"/>
      </g>
    </g>

    <!-- Padlock outlines; each is drawn twice, a darker copy offset
         down-right giving the brass its thickness. -->
    <path id="shackle" d="M-82 -140 V-182 A82 82 0 0 1 82 -182 V-140" stroke-width="30" fill="none"/>
    <path id="lock-body" d="M-152 -147 H-34 L0 -85 L34 -147 H152 L0 147Z" stroke-width="16" stroke-linejoin="round"/>
  </defs>

  <rect width="512" height="512" rx="112" fill="#1f1b18"/>

  <!-- Book -->
  <g transform="translate(180 209) scale(0.74)">
    <use xlink:href="#book-half"/>
    <use xlink:href="#book-half" transform="scale(-1 1)"/>
    <!-- Bottom of the spine -->
    <path d="M-14 146 Q0 166 14 146" stroke="#7a2e2a" stroke-width="18" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Padlock -->
  <g transform="translate(302 297) scale(0.74)">
    <g transform="translate(14 14)" fill="#a87a24" stroke="#a87a24">
      <use xlink:href="#shackle" fill="none"/>
      <use xlink:href="#lock-body"/>
    </g>
    <g fill="#d6a640" stroke="#d6a640">
      <use xlink:href="#shackle" fill="none"/>
      <use xlink:href="#lock-body"/>
    </g>
    <!-- Keyhole, in the background colour -->
    <circle cx="0" cy="-10" r="24" fill="#1f1b18"/>
    <path d="M-14.88 -2.08 h29.76 l9.12 63.84 h-48z" fill="#1f1b18"/>
  </g>
</svg>
