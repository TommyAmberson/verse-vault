name = "vv-router"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# The root of www.versevault.ca is the CF Pages project (custom domain); these
# routes carve out what it can't serve. Each prefix needs two patterns: the bare
# path (`/vv`, `/api`) and everything under it. `/api/*` was qzr-api's until
# qzr moved to /qzr/api/*, and Cloudflare refuses a route another Worker holds,
# so this deploys only after qzr-api has dropped it.
[[routes]]
pattern = "www.versevault.ca/vv"
zone_name = "versevault.ca"

[[routes]]
pattern = "www.versevault.ca/vv/*"
zone_name = "versevault.ca"

[[routes]]
pattern = "www.versevault.ca/api"
zone_name = "versevault.ca"

[[routes]]
pattern = "www.versevault.ca/api/*"
zone_name = "versevault.ca"

[vars]
# Tunnel-fronted API hostname (from `cloudflared tunnel route dns`).
API_HOST = "vv-api.versevault.ca"
